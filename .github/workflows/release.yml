name: Release

# HACS installs from git tags and GitHub releases, so there is nothing to zip:
# push a tag such as v0.1.0 and this creates the release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches manifest.json
        run: |
          version=$(python3 -c "import json;print(json.load(open('custom_components/solar_dash/manifest.json'))['version'])")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest version $version" >&2
            exit 1
          fi
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
